name: Build MS Questions Bank APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Extract project
        run: |
          unzip -o Ms_Questions_Bank_FINAL.zip -d project
          find project -name pubspec.yaml -print

      - name: Prepare Flutter project
        run: |
          APP_DIR=$(dirname "$(find project -name pubspec.yaml | head -1)")
          cd "$APP_DIR"
          flutter create .
          flutter pub get
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$APP_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-Questions-Bank-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
